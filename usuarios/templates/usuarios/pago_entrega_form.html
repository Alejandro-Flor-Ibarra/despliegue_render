{% extends "base.html" %}

{% block title %}Registrar pago{% endblock %}

{% block content %}
<div class="container">
    <h1>Registrar pago: {{ metodo }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-waysmart">
            Guardar pago
        </button>
    </form>

    <a href="{% url 'usuarios:pagos_entrega' %}">Volver a métodos de pago</a>
</div>
{% endblock %}
