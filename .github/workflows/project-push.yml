name: Move project items on push

on:
  push:
    branches:
      - main
      - develop

jobs:
  update-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark as updated on push
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            const branch = context.ref.replace('refs/heads/', '')
            const message = `Push detectado en ${branch}`
            console.log(message)